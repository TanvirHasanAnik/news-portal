name = "alo-ashbe"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
DB_HOST = "127.0.0.1"
DB_PORT = "3307"
DB_USER = "root"
DB_PASSWORD = "123456"
DB_NAME = "newsportal_db"

[[d1_databases]]
binding = "DB"
database_name = "news-portal-db"
database_id = "news-portal-db-local"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "news-portal-tag-cache"
database_id = "news-portal-tag-cache-local"

[[r2_buckets]]
binding = "NEWS_IMAGES_BUCKET"
bucket_name = "news-portal-images"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "news-portal-isr-cache"

[[kv_namespaces]]
binding = "REVALIDATE_RATE_LIMIT_KV"
id = "revalidate-rate-limit-kv-local"
