name = "alo-ashbe"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "news-portal-db"
database_id = "4b0601b0-2897-48cd-b385-a165d32b10a3"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "news-portal-tag-cache"
database_id = "551bed68-2d55-4760-8e05-f9d084d1f522"

[[r2_buckets]]
binding = "news_portal_images"
bucket_name = "news-portal-images"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "news-portal-isr-cache"

[[kv_namespaces]]
binding = "REVALIDATE_RATE_LIMIT_KV"
id = "d48561caa1e04a4b960c9253c6683daa"
