name = "news-portal"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# MySQL / TiDB Environment Variables
[vars]
DB_HOST = "127.0.0.1"
DB_PORT = "3307"
DB_USER = "root"
DB_PASSWORD = "123456"
DB_NAME = "newsportal_db"

# Cloudflare D1 Database binding
# For local dev / preview via wrangler, any database_id works.
# For remote production, create with: npx wrangler d1 create news-portal-db
[[d1_databases]]
binding = "DB"
database_name = "news-portal-db"
database_id = "news-portal-db-local"

# Cloudflare R2 Bucket binding (for news images)
[[r2_buckets]]
binding = "NEWS_IMAGES_BUCKET"
bucket_name = "news-portal-images"
