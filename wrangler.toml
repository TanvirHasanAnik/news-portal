name = "news-portal"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare D1 Database binding
# For local dev / preview via wrangler, any database_id works.
# For remote production, create with: npx wrangler d1 create news-portal-db
[[d1_databases]]
binding = "DB"
database_name = "news-portal-db"
database_id = "news-portal-db-local"

# Cloudflare R2 Bucket binding (for assets / media)
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "news-portal-assets"
