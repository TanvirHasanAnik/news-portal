<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <radialGradient id="centerLight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <pattern id="dotGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#94a3b8" fill-opacity="0.18" />
    </pattern>

    <clipPath id="watermarkBadgeClip">
      <rect x="0" y="0" width="130" height="130" rx="32" />
    </clipPath>

    <style>
      .brand-title {
        font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Serif Bengali', 'Vrinda', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 44px;
        fill: #1e293b;
        letter-spacing: -0.5px;
      }
      .brand-tagline {
        font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Serif Bengali', 'Vrinda', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #475569;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#centerLight)" />
  <rect width="1600" height="900" fill="url(#dotGrid)" />

  <g stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M 80 120 L 80 80 L 120 80" />
    <path d="M 1480 80 L 1520 80 L 1520 120" />
    <path d="M 80 780 L 80 820 L 120 820" />
    <path d="M 1480 820 L 1520 820 L 1520 780" />

    <line x1="800" y1="60" x2="800" y2="85" />
    <line x1="800" y1="815" x2="800" y2="840" />
    <line x1="60" y1="450" x2="85" y2="450" />
    <line x1="1515" y1="450" x2="1540" y2="450" />

    <circle cx="800" cy="450" r="280" stroke-dasharray="3 9" stroke-opacity="0.15" />
  </g>

  <g opacity="0.22" transform="translate(800, 450)">
    <g transform="translate(-65, -135)">
      <rect x="0" y="0" width="130" height="130" rx="32" fill="url(#emblemGrad)" />
      <rect x="1" y="1" width="128" height="128" rx="31" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

      <g clip-path="url(#watermarkBadgeClip)">
        <g fill="#f8fafc" opacity="0.3">
          <path d="M 65 72 L 28 20 L 39 16 Z" />
          <path d="M 65 72 L 59 13 L 71 13 Z" />
          <path d="M 65 72 L 91 16 L 102 20 Z" />
          <path d="M 65 72 L 112 44 L 120 54 Z" />
          <path d="M 65 72 L 10 54 L 18 44 Z" />
        </g>

        <circle cx="65" cy="72" r="38" fill="#e2e8f0" opacity="0.35" />

        <circle cx="65" cy="72" r="28" fill="#64748b" />

        <path d="M 42 82 Q 65 60 88 82" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

        <path d="M 0 98 Q 32 85 65 94 T 130 89 L 130 135 L 0 135 Z" fill="#0f172a" opacity="0.8" />
        <path d="M 0 106 Q 38 94 72 100 T 130 96 L 130 135 L 0 135 Z" fill="#020617" opacity="0.9" />
      </g>
    </g>

    <text x="0" y="55" text-anchor="middle" class="brand-title">আলো আসবে</text>
    <text x="0" y="92" text-anchor="middle" class="brand-tagline">সত্য ও সাহসের অগ্রদূত</text>
  </g>
</svg>
