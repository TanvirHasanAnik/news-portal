<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f1f5f9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Bangladesh Flag Green Gradient -->
    <linearGradient id="bdGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057a55" />
      <stop offset="50%" stop-color="#006a4e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Crimson Red Sun Gradient -->
    <radialGradient id="bdRedSun" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="45%" stop-color="#f42a41" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Sun Dawn Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <!-- Premium Card Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#006a4e" flood-opacity="0.25" />
    </filter>

    <!-- Newspaper Background Grid Pattern -->
    <pattern id="newsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="20" cy="20" r="1" fill="#94a3b8" fill-opacity="0.35" />
    </pattern>

    <style>
      .placeholder-brand-title {
        font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Serif Bengali', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #0f172a;
        letter-spacing: -0.5px;
      }
      .placeholder-brand-tagline {
        font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Serif Bengali', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #64748b;
        letter-spacing: 0.25px;
      }
      .placeholder-badge-text {
        font-family: 'SolaimanLipi', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #991b1b;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- 1. Full Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />
  <rect width="1200" height="675" fill="url(#centerGlow)" />
  <rect width="1200" height="675" fill="url(#newsGrid)" />

  <!-- 2. Decorative Editorial Newspaper Graphic Lines (Abstract Watermark) -->
  <g opacity="0.12" stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <!-- Top-left editorial column lines -->
    <line x1="80" y1="90" x2="280" y2="90" stroke-width="4" stroke="#475569" />
    <line x1="80" y1="110" x2="340" y2="110" />
    <line x1="80" y1="125" x2="310" y2="125" />
    <line x1="80" y1="140" x2="290" y2="140" />
    <line x1="80" y1="155" x2="240" y2="155" />

    <!-- Bottom-right editorial lines -->
    <line x1="880" y1="520" x2="1120" y2="520" stroke-width="4" stroke="#475569" />
    <line x1="880" y1="540" x2="1100" y2="540" />
    <line x1="920" y1="555" x2="1120" y2="555" />
    <line x1="880" y1="570" x2="1060" y2="570" />
    <line x1="940" y1="585" x2="1120" y2="585" />
  </g>

  <!-- 3. Top Decorative Brand Accent Strip -->
  <rect x="0" y="0" width="1200" height="5" fill="#dc2626" />
  <rect x="0" y="5" width="1200" height="2" fill="#006a4e" opacity="0.6" />

  <!-- 4. Central Showcase Card -->
  <g transform="translate(380, 162.5)" filter="url(#cardShadow)">
    <!-- Card Surface -->
    <rect width="440" height="350" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.5" />
    <rect width="440" height="350" rx="20" stroke="#e2e8f0" stroke-width="1" />

    <!-- Top Badge ("সংবাদ চিত্র" / News Visual) -->
    <g transform="translate(145, 26)">
      <rect width="150" height="28" rx="14" fill="#fee2e2" stroke="#fecaca" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#dc2626" />
      <text x="32" y="19" class="placeholder-badge-text">আলো আসবে সংবাদ</text>
    </g>

    <!-- Center Icon Showcase: Brand Logo Emblem + Newspaper Graphic -->
    <g transform="translate(180, 80)">
      <!-- Backdrop glow for emblem -->
      <circle cx="40" cy="40" r="48" fill="#e0f2fe" opacity="0.4" />
      
      <!-- Bangladesh Bottle Green Badge Canvas -->
      <g filter="url(#iconShadow)">
        <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#bdGreenGrad)" />
        <rect x="0.5" y="0.5" width="79" height="79" rx="19.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
        
        <!-- Clipped elements -->
        <g clip-path="url(#badgeInnerClip)">
          <clipPath id="badgeInnerClip">
            <rect x="0" y="0" width="80" height="80" rx="20" />
          </clipPath>

          <!-- Dawn Light Rays -->
          <g opacity="0.4">
            <path d="M 40 46 L 16 14 L 23 12 Z" fill="#fef08a" />
            <path d="M 40 46 L 36 10 L 44 10 Z" fill="#fef08a" />
            <path d="M 40 46 L 57 12 L 64 14 Z" fill="#fef08a" />
            <path d="M 40 46 L 70 29 L 75 36 Z" fill="#fef08a" />
            <path d="M 40 46 L 7 36 L 12 29 Z" fill="#fef08a" />
          </g>

          <!-- Golden Sun Aura -->
          <circle cx="40" cy="46" r="26" fill="url(#sunGlow)" />

          <!-- Bangladesh Red Sun Circle -->
          <circle cx="40" cy="46" r="20" fill="url(#bdRedSun)" />

          <!-- Golden Dawn Arc -->
          <path d="M 26 53 Q 40 39 54 53" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />

          <!-- Green Landscape Wave -->
          <path d="M 0 63 Q 20 52 40 60 T 80 55 L 80 85 L 0 85 Z" fill="#045a3d" opacity="0.9" />
          <path d="M 0 68 Q 24 58 45 64 T 80 61 L 80 85 L 0 85 Z" fill="#03452e" />
        </g>
      </g>
    </g>

    <!-- Editorial Newspaper Outline Accent -->
    <g transform="translate(192, 178)" opacity="0.75">
      <!-- Camera/Image Outline Graphic -->
      <path d="M 12 0 L 44 0 C 47 0 49 2 50 5 L 53 10 L 58 10 C 62 10 65 13 65 17 L 65 38 C 65 42 62 45 58 45 L -2 45 C -6 45 -9 42 -9 38 L -9 17 C -9 13 -6 10 -2 10 L 3 10 L 6 5 C 7 2 9 0 12 0 Z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
      <circle cx="28" cy="27" r="10" stroke="#94a3b8" stroke-width="2" fill="#f8fafc" />
      <circle cx="46" cy="18" r="2.5" fill="#ef4444" />
    </g>

    <!-- Typography: Brand Name & Tagline -->
    <text x="220" y="260" text-anchor="middle" class="placeholder-brand-title">আলো আসবে</text>
    <text x="220" y="288" text-anchor="middle" class="placeholder-brand-tagline">সত্য ও সাহসের অগ্রদূত</text>

    <!-- Bottom Subtle URL & Decorative Divider -->
    <line x1="60" y1="308" x2="380" y2="308" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="220" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">ALOASHBE.COM</text>
  </g>

  <!-- 5. Bottom Brand Strip -->
  <rect x="0" y="670" width="1200" height="5" fill="#006a4e" />
</svg>
