<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 76" width="310" height="76" fill="none">
  <defs>
    <!-- Bangladesh Flag Green Gradient -->
    <linearGradient id="bdGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057a55" />
      <stop offset="50%" stop-color="#006a4e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Bangladesh Flag Crimson Red Sun Gradient -->
    <radialGradient id="bdRedSun" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="45%" stop-color="#f42a41" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Sun Dawn Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <style>
      .brand-title {
        font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Serif Bengali', sans-serif;
        font-weight: 400;
        font-size: 38px;
        fill: #0f172a;
        letter-spacing: -0.5px;
      }
      .brand-tagline {
        font-family: 'SolaimanLipi', 'Hind Siliguri', sans-serif;
        font-weight: 400;
        font-size: 13px;
        fill: #475569;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Abstract Bangladesh Flag Emblem (Bottle Green Badge + Rising Crimson Red Sun & Dawn Light) -->
  <g filter="url(#shadow)">
    <!-- Bangladesh Green Badge Canvas -->
    <rect x="2" y="6" width="64" height="64" rx="16" fill="url(#bdGreenGrad)" />
    <!-- Inner Glass Border -->
    <rect x="2.5" y="6.5" width="63" height="63" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

    <!-- Abstract Flag & Light Elements (Clipped inside rounded badge) -->
    <g clip-path="url(#badgeClip)">
      <clipPath id="badgeClip">
        <rect x="2" y="6" width="64" height="64" rx="16" />
      </clipPath>

      <!-- Dawn Light Rays Radiating from the Sun (Light Coming - 'আলো আসবে') -->
      <g opacity="0.35">
        <path d="M 34 38 L 14 12 L 20 10 Z" fill="#fef08a" />
        <path d="M 34 38 L 31 8 L 37 8 Z" fill="#fef08a" />
        <path d="M 34 38 L 48 10 L 54 12 Z" fill="#fef08a" />
        <path d="M 34 38 L 58 24 L 62 30 Z" fill="#fef08a" />
        <path d="M 34 38 L 6 30 L 10 24 Z" fill="#fef08a" />
      </g>

      <!-- Golden Sun Aura -->
      <circle cx="34" cy="38" r="22" fill="url(#sunGlow)" />

      <!-- Iconic Bangladesh Red Sun Circle -->
      <circle cx="34" cy="38" r="16.5" fill="url(#bdRedSun)" />

      <!-- Dynamic Golden Dawn Arc (Symbolizing 'আলো আসবে' / Rising Dawn Light) -->
      <path d="M 22 44 Q 34 32 46 44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

      <!-- Abstract Green Horizon Wave (Landscape of Bangladesh) -->
      <path d="M 2 52 Q 18 43 34 49 T 66 45 L 66 70 L 2 70 Z" fill="#045a3d" opacity="0.9" />
      <path d="M 2 56 Q 20 48 38 53 T 66 50 L 66 70 L 2 70 Z" fill="#03452e" />
    </g>
  </g>

  <!-- Brand Typography: আলো আসবে -->
  <g transform="translate(80, 0)">
    <!-- Main Title: আলো আসবে -->
    <text x="0" y="44" class="brand-title">আলো আসবে</text>
    
    <!-- Tagline (Bangla only - no English slogan) -->
    <text x="0" y="65" class="brand-tagline">সত্য ও সাহসের অগ্রদূত</text>
  </g>
</svg>
